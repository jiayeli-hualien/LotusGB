name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out LotusGB
        uses: actions/checkout@v7
        with:
          path: lotus-gbemu

      - name: Check out pinned GBIT fork
        uses: actions/checkout@v7
        with:
          repository: jiayeli-hualien/gbit
          ref: 40c5247b818a7c524e3c3e75fe0fde900a4ee8e9
          path: gbit

      - name: Build and check GBIT
        run: |
          make -C gbit
          make -C gbit test

      - name: Build LotusGB
        working-directory: lotus-gbemu
        run: make build

      - name: Run CPU unit tests
        working-directory: lotus-gbemu
        run: make test

      - name: Run GBIT instruction tests
        working-directory: lotus-gbemu
        run: |
          cd build
          LD_LIBRARY_PATH="../../gbit:.${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ./gbit_test
